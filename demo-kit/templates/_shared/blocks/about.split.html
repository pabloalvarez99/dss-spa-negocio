<section class="{{blk.classes}}" id="{{blk.anchor}}">
  <div class="wrap about-grid">
    <div class="sec-head reveal" style="margin-bottom:0">
      <p class="kicker">Nosotros</p>
      <h2>{{about_title_html}}</h2>
      <p>{{about}}</p>
      {{#if instagram}}
      <p style="margin-top:1.25rem">
        <a class="btn btn-ghost" href="{{instagram}}" target="_blank" rel="noopener">Instagram</a>
      </p>
      {{/if}}
    </div>
    <div class="about-card reveal">
      <span class="badge">{{city}}</span>
      <p>{{about_card}}</p>
    </div>
  </div>
</section>
