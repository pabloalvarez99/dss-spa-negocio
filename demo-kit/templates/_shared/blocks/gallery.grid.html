<section class="{{blk.classes}}" id="{{blk.anchor}}" aria-label="Galería">
  <div class="wrap">
    <div class="sec-head reveal">
      <p class="kicker">Fotos</p>
      <h2>{{gallery_title_html}}</h2>
      <p>{{gallery_intro}}</p>
    </div>
    <div class="gallery-grid">
      {{#each gallery_items}}
      <figure class="reveal"><img src="{{this.src}}" alt="{{this.alt}}" loading="lazy" width="400" height="400" /></figure>
      {{/each}}
    </div>
  </div>
</section>
