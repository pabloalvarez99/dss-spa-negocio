<header class="{{blk.classes}}" id="{{blk.anchor}}">
  <div class="wrap">
    <p class="hero-tag">{{city}} · {{eyebrow}}</p>
    <h1>{{hero_title_html}}</h1>
    <p class="lead">{{tagline}}</p>
    <div class="hero-call">
      <p class="call-label">Línea directa</p>
      <a class="hero-phone" href="{{wa_url}}" target="_blank" rel="noopener" data-track="hero-wa">{{phone_display}}</a>
      <p class="call-badge"><span class="pulse-dot" aria-hidden="true"></span>Respuesta rápida por WhatsApp</p>
    </div>
    <div class="hero-ctas">
      <a class="btn btn-solid" href="{{wa_url}}" target="_blank" rel="noopener" data-track="hero-wa">{{cta_primary}}</a>
      <a class="btn btn-line" href="#{{menu_anchor}}">{{cta_secondary}}</a>
    </div>
  </div>
</header>
